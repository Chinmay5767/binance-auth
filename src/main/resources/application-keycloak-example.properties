# Copy the relevant settings into your active application.properties.
# Keep secrets in environment variables; never commit real client secrets.

keycloak.base-url=${KEYCLOAK_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:master}
keycloak.admin.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:crypto-service-client}
keycloak.admin.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET}
keycloak.registration.send-verification-email=${KEYCLOAK_SEND_VERIFICATION_EMAIL:false}

# Spring browser OAuth2 login uses the Authorization Code flow.
spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:master}
spring.security.oauth2.client.registration.keycloak.provider=keycloak
spring.security.oauth2.client.registration.keycloak.client-id=${KEYCLOAK_USER_CLIENT_ID:crypto-user-client}
spring.security.oauth2.client.registration.keycloak.client-secret=${KEYCLOAK_USER_CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email

# Resource-server JWT validation. The issuer must exactly match the token's iss claim.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_URL:http://localhost:8080}/realms/${KEYCLOAK_REALM:master}
